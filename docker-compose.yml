version: '3.8'

services:
  pixel-tracker:
    user: root
    build: .
    ports:
      - "8070:8070"
  
    environment:
      - DEBUG=${DEBUG:-false}
      - GCS_BUCKET=${GCS_BUCKET}
      - GCS_PROJECT=${GCS_PROJECT}
      - SECRET_KEY=${SECRET_KEY}
      - PORT=${PORT:-8070}
    command: python3 app.py
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - pixel-network

networks:
  pixel-network:
    driver: bridge
